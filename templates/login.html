{% extends "base.html" %}
{% block title %}로그인 · ETNS 할일관리{% endblock %}

{% block content %}
<section class="card auth-card">
  <h2>로그인</h2>
  <form class="edit-form" method="post">
    <label>아이디
      <input type="text" name="username" maxlength="50" autofocus required>
    </label>
    <label>비밀번호
      <input type="password" name="password" required>
    </label>
    <div class="row end">
      <button class="btn" type="submit">로그인</button>
    </div>
  </form>
  <p class="auth-switch">
    계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a>
  </p>
</section>
{% endblock %}
